server_tokens off;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

server {
  listen 80;
  server_name bank.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name bank.example.com;
  ssl_certificate     /etc/letsencrypt/live/bank.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bank.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 6m;                       # ID photos are capped at 5 MB in the app

  location /static/ { alias /srv/klosa/staticfiles/; expires 7d; access_log off; }

  location ~ ^/accounts/(login|signup|verify-phone|recover|2fa)/ {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/klosa_proxy.conf;
  }
  location /ops-change-this-random-words/ {      # the admin: only your office or VPN address
    allow 203.0.113.10;
    deny all;
    include /etc/nginx/klosa_proxy.conf;
  }
  location / {
    limit_req zone=general burst=40 nodelay;
    include /etc/nginx/klosa_proxy.conf;
  }
}
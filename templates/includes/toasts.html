<style>
  .kt-wrap{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:2147483000;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
  .kt{pointer-events:auto;width:100%;max-width:440px;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.45);
    font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#061B3D;background:#fff;cursor:pointer;
    opacity:0;transform:translateY(-22px) scale(.98);transition:opacity .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
  .kt.on{opacity:1;transform:none}.kt.off{opacity:0;transform:translateY(-14px)}
  .kt::before{content:"";flex:none;width:6px;align-self:stretch;border-radius:99px;background:#007BFF}
  .kt-success{background:#35E0A1}.kt-success::before{background:#0B7A55}
  .kt-error{background:#FFB3B3}.kt-error::before{background:#C0392B}
  .kt-warning{background:#FFD166}.kt-warning::before{background:#B07A00}
  @media (prefers-reduced-motion:reduce){.kt{transition:none}}
</style>
<div class="kt-wrap" id="ktWrap" role="status" aria-live="polite">
</div>
<script>
(() => {
  const wrap = document.getElementById("ktWrap");
  if (!wrap) return;
  const hide = (el) => { el.classList.remove("on"); el.classList.add("off"); setTimeout(() => el.remove(), 350); };
  const show = (el, i) => setTimeout(() => {
    el.classList.add("on");
    el.addEventListener("click", () => hide(el));
    setTimeout(() => hide(el), el.classList.contains("kt-error") ? 8000 : 5000);
  }, 150 + i * 300);
  wrap.querySelectorAll(".kt").forEach(show);
  window.klosaToast = (text, level) => {                 // for messages created in JavaScript
    const d = document.createElement("div"); d.className = "kt kt-" + (level || "info");
    const s = document.createElement("span"); s.textContent = text; d.appendChild(s);
    wrap.appendChild(d); show(d, 0);
  };
})();
</script>

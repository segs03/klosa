
{% extends 'base.html' %}
{% load static %}
{% block title %} Klosa Bank - Login {% endblock %}

{% block content %}
<div class='col container'>
    <img src="{% static 'images/klosa_mark_white.png' %}" width="100px" height="100px">
    <p>Login to your account</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <fieldset class='col login'>
        <div class='form-group'>
        <label for='username'>Username</label>
        <input type="text" name="username" id='username' placeholder='Username' required>
        </div>

        <div class='form-group'>
        <label for='password'>Password</label>
        <input type="password" placeholder='Password' id='password' name="password" required>
        </div>

        <button type="submit" class='btn'>Login</button>
        </fieldset>
        
<button type="button" id="passkeyBtn" class="pill-button" hidden>Sign in with fingerprint or face</button>
<p id="passkeyErr" class="field-error"></p>

<script src="{% static 'accounts/js/passkeys.js' %}"></script>
<script>
  const btn = document.getElementById("passkeyBtn");
  if (window.PublicKeyCredential) btn.hidden = false;
  btn.addEventListener("click", async () => {
    try {
      await passkeyLogin(
        { options: "{% url 'accounts:passkey_login_options' %}",
          verify: "{% url 'accounts:passkey_login_verify' %}" },
        "{{ next|escapejs }}");
    } catch (e) {
      document.getElementById("passkeyErr").textContent =
        e.name === "NotAllowedError" ? "Cancelled." : e.message;
    }
  });
</script>
        
    </form>
    </div>
    
{% endblock %}

{% extends 'base.html' %}
{% block title %}Face check - Klosa Bank{% endblock %}
{% block content %}
{% include "biller/_style.html" %}
<style>.fc-box{position:relative;width:min(86vw,340px);aspect-ratio:1;margin:8px auto 16px;border-radius:50%;overflow:hidden;border:4px solid #00E5FF;background:#000;box-shadow:0 0 0 8px rgba(0,229,255,.15)}
  .fc-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #fcPrompt{text-align:center;font-size:22px;font-weight:700;min-height:30px;margin:0}#fcCount{text-align:center;font-size:44px;font-weight:700;color:#00E5FF;min-height:56px;margin:4px 0}</style>
<section class="bl">
  <header class="bl-head"><div><h1>Face check</h1><p>Keep your face inside the circle</p></div></header>
  <div class="fc-box"><video id="fcCam" playsinline muted autoplay></video></div>
  <canvas id="fcCv" hidden></canvas>
  <p id="fcPrompt"></p><p id="fcCount"></p><p class="bl-err" id="fcMsg" style="text-align:center" role="alert"></p>
  <input type="hidden" id="fcToken">{% csrf_token %}
  <button class="bl-btn" id="fcGo" type="button">Begin</button>
</section>
{{ labels|json_script:"fcLabels" }}
<script>
(() => {
  const $ = (i) => document.getElementById(i);
  const labels = JSON.parse($("fcLabels").textContent), cam = $("fcCam"), cv = $("fcCv"), go = $("fcGo");
  const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value, sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let stream;
  async function shot(i) {
    const k = Math.min(1, 640 / Math.max(cam.videoWidth, cam.videoHeight));
    cv.width = Math.round(cam.videoWidth * k); cv.height = Math.round(cam.videoHeight * k);
    cv.getContext("2d").drawImage(cam, 0, 0, cv.width, cv.height);
    const blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", 0.7));
    const fd = new FormData(); fd.append("step", i); fd.append("image", blob, "f.jpg");
    const res = await fetch("{% url 'accounts:face_frame' %}", {method: "POST", body: fd, credentials: "same-origin", headers: {"X-CSRFToken": csrf}});
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || "Something went wrong.");
    return d;
  }
  go.addEventListener("click", async () => {
    go.hidden = true; $("fcMsg").textContent = "";
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "user", width: {ideal: 640}, height: {ideal: 640}}, audio: false});
      cam.srcObject = stream; await cam.play();
      for (let i = 0; i < labels.length; i++) {
        $("fcPrompt").textContent = labels[i];
        for (let s = 3; s > 0; s--) { $("fcCount").textContent = s; await sleep(1000); }
        $("fcCount").textContent = "Hold still";
        const d = await shot(i);
        if (d.done) { location.href = d.next; return; }
      }
    } catch (e) {
      $("fcMsg").textContent = e.name === "NotAllowedError" ? "Allow the camera to continue." : e.message;
      $("fcCount").textContent = ""; go.hidden = false; go.textContent = "Start over";
      go.onclick = () => { location.href = "{% url 'accounts:face_start' %}"; };
    } finally { if (stream) stream.getTracks().forEach((t) => t.stop()); }
  });
})();
</script>
{% endblock %}
